[project]
name = "ax-prontier-ai"
version = "0.1.0"
description = "AI agents for AX-Prontier"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "beautifulsoup4>=4.12.3",
  "markdownify>=0.12.1",
  "uvicorn[standard]>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
  "requests>=2.32.3",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.1,<4.0",
  "python-dotenv>=1.0,<2.0",
  "pyyaml>=6.0,<7.0",
  "google-genai>=1.0,<2.0",
  "sentence-transformers>=3.0,<4.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]
dev = [
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
  "agents/library/tests",
  "agents/main_agent/tests",
  "agents/orchestrator/tests",
  "agents/document_review/tests",
  "ingestion/tests",
]
markers = [
  "integration: tests that may download local models or call external services",
]

[tool.setuptools.packages.find]
include = ["agents*", "shared*", "ingestion*"]
exclude = ["data*"]
